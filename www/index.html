<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Road to AGI</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-screen="models">
  <header id="top">
    <button id="moreBtn" aria-label="Meer: singulariteit, prestaties en instellingen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.6" ry="4.2" transform="rotate(-28 12 12)"/><circle class="f" cx="12" cy="12" r="3.2"/><circle cx="19.6" cy="7.6" r="1.2" fill="currentColor"/></svg>
      <i class="dot" id="dotSing"></i>
    </button>
    <div class="bank">
      <div class="tokens"><span id="tokens">0</span><small>tokens</small></div>
      <div class="tps"><span id="tps">0</span> per seconde</div>
    </div>
    <div class="agi">
      <div class="agi-label"><span id="eraName">Het begin</span><span id="agiPct">0%</span></div>
      <div class="bar"><i id="agiBar"></i></div>
    </div>
    <button id="quest" class="hidden" aria-live="polite">
      <span class="qa">🤖</span>
      <span class="qt"><small>Ada · opdracht <span id="questNum"></span></small><span id="questText"></span><i class="qbar"><b id="questBar"></b></i></span>
      <span class="qr" id="questReward"></span>
    </button>
  </header>

  <section id="stage">
    <div id="floor" aria-hidden="true"></div>
    <canvas id="fx"></canvas>
    <div id="buffs"></div>
    <div id="orbit" aria-hidden="true"></div>
    <button id="core" aria-label="Train het model">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="orbGrad" cx="45%" cy="38%" r="65%">
            <stop offset="0" style="stop-color:#ffffff"/>
            <stop offset=".25" style="stop-color:var(--c1)"/>
            <stop offset=".75" style="stop-color:var(--c2)"/>
            <stop offset="1" style="stop-color:#0a0f24"/>
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="flow-track" cx="100" cy="100" r="98" fill="none" stroke-width="3"/>
        <circle class="flow-ring" id="flowRing" cx="100" cy="100" r="98" fill="none" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="615.8" stroke-dashoffset="615.8"/>
        <g class="sats"><circle cx="100" cy="14" r="3"/><circle cx="174" cy="143" r="2.5"/><circle cx="26" cy="143" r="2.5"/><circle cx="174" cy="57" r="2"/><circle cx="26" cy="57" r="2"/><circle cx="100" cy="186" r="3"/></g>
        <g class="ring r1"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--c1)" stroke-width="1.5" stroke-dasharray="4 10" opacity=".7"/></g>
        <g class="ring r2"><circle cx="100" cy="100" r="82" fill="none" stroke="var(--c2)" stroke-width="3" stroke-dasharray="60 30 10 30" opacity=".8"/></g>
        <g class="ring r3"><circle cx="100" cy="100" r="72" fill="none" stroke="var(--c1)" stroke-width="1" stroke-dasharray="1 6" opacity=".9"/></g>
        <circle class="orb" cx="100" cy="100" r="60" fill="url(#orbGrad)" filter="url(#glow)"/>
        <g class="net" stroke="rgba(255,255,255,.55)" stroke-width="1.2" fill="#fff">
          <line x1="72" y1="80" x2="100" y2="68"/><line x1="72" y1="80" x2="100" y2="100"/><line x1="72" y1="120" x2="100" y2="100"/>
          <line x1="72" y1="120" x2="100" y2="132"/><line x1="72" y1="80" x2="100" y2="132"/><line x1="72" y1="120" x2="100" y2="68"/>
          <line x1="100" y1="68" x2="128" y2="90"/><line x1="100" y1="100" x2="128" y2="90"/><line x1="100" y1="100" x2="128" y2="112"/>
          <line x1="100" y1="132" x2="128" y2="112"/><line x1="100" y1="68" x2="128" y2="112"/><line x1="100" y1="132" x2="128" y2="90"/>
          <circle cx="72" cy="80" r="4"/><circle cx="72" cy="120" r="4"/>
          <circle cx="100" cy="68" r="4"/><circle cx="100" cy="100" r="4"/><circle cx="100" cy="132" r="4"/>
          <circle cx="128" cy="90" r="4"/><circle cx="128" cy="112" r="4"/>
        </g>
      </svg>
    </button>
    <div class="scr" id="scrChips">
      <div class="flow big" id="csFlow"></div>
      <button class="cs-chip" id="csChip" aria-label="Tik op je chip">
        <span class="cs-glow"></span><span class="cs-icon" id="csIcon"></span>
        <span class="cs-name" id="csName"></span>
      </button>
      <div class="cs-stats"><span id="csCompute"></span><span id="csHint"></span></div>
    </div>
    <div class="scr" id="scrApps">
      <div class="as-phone"><div class="as-notch"></div><div class="as-grid" id="asGrid"></div></div>
      <div class="as-side">
        <small>Gebruikers</small><b id="asUsers">0</b>
        <small>Data voor je modellen</small><b id="asData">×1,00</b>
        <div id="asTrend"></div>
      </div>
      <div class="as-review" id="asReview"></div>
    </div>
    <div id="tapInfo" aria-live="off"><span id="tapVal"></span><span id="flowLbl"></span></div>
    <div id="floaters"></div>
    <div id="ticker"><span id="tickerText"></span></div>
  </section>

  <main id="panel">
    <header id="scrHead">
      <span class="sh-ic" id="shIcon"></span>
      <div class="sh-txt"><h2 id="shTitle"></h2><small id="shSub"></small></div>
      <div class="pdots" id="pdots"></div>
      <button class="sh-close hidden" id="shClose" aria-label="Sluiten">✕</button>
    </header>
    <section class="tab active" id="tab-models">
      <div class="tabhead">
        <span class="muted">Kopen per</span>
        <div class="seg" id="buyMode">
          <button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="100">×100</button><button data-m="max">Max</button>
        </div>
      </div>
      <div class="boosts" id="boosts"></div>
      <div id="genList"></div>
    </section>
    <section class="tab" id="tab-research">
      <div class="tabhead">
        <div class="seg" id="resSeg">
          <button data-r="lab" class="on"><b>🏢</b>Lab</button><button data-r="models"><b>🧠</b>Modellen</button><button data-r="chips"><b>💾</b>Chips</button><button data-r="apps"><b>📱</b>Apps</button><button data-r="upg"><b>⚡</b>Overig</button>
        </div>
      </div>
      <div class="res-head"><b id="resTitle"></b><span class="muted" id="researchCount"></span></div>
      <div class="bar research-bar"><i id="researchBar"></i></div>
      <div id="treeBody"></div>
      <div id="upgList" class="hidden"></div>
    </section>
    <section class="tab" id="tab-chips">
      <div class="tabhead sub-info"><span class="muted" id="chipHead"></span></div>
      <div id="chipBody"></div>
    </section>
    <section class="tab" id="tab-apps">
      <div class="tabhead sub-info"><span class="muted" id="appHead"></span></div>
      <div id="appList"></div>
    </section>
    <section class="tab" id="tab-team">
      <div class="tabhead sub-info"><span class="muted" id="teamHead"></span></div>
      <div id="teamList"></div>
    </section>
    <section class="tab" id="tab-more">
      <div class="tabhead">
        <div class="seg" id="moreSeg">
          <button data-s="sing" class="on">🌀 Singulariteit</button><button data-s="ach">🏆 Prestaties</button><button data-s="set">⚙️ Overig</button>
        </div>
      </div>
      <div class="sub" id="sub-sing"><div id="singBody"></div></div>
      <div class="sub hidden" id="sub-ach"><p class="muted" id="achCount"></p><div id="achGrid"></div></div>
      <div class="sub hidden" id="sub-set"><div id="moreBody"></div></div>
    </section>
  </main>

  <nav id="tabs">
    <i id="tabInd" aria-hidden="true"></i>
    <button data-tab="models" class="on" aria-label="Modellen"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8.2l3.2 2.6M7 15.8l3.2-2.6M13.8 10.8L17 8.2M13.8 13.2l3.2 2.6"/><circle cx="5" cy="7" r="2.2"/><circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="7" r="2.2"/><circle cx="19" cy="17" r="2.2"/><circle class="f" cx="12" cy="12" r="2.8"/></svg></span><span class="lb">Modellen</span></button>
    <button data-tab="chips" aria-label="Chips"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2.5V5.5M15 2.5V5.5M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/><rect x="5.5" y="5.5" width="13" height="13" rx="2.6"/><rect class="f" x="9.3" y="9.3" width="5.4" height="5.4" rx="1.1"/></svg><i class="dot" id="dotChips"></i></span><span class="lb">Chips</span></button>
    <button data-tab="apps" aria-label="Apps"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.5" width="13" height="19" rx="3"/><rect class="f" x="8.6" y="6.2" width="2.8" height="2.8" rx=".7"/><rect class="f" x="12.6" y="6.2" width="2.8" height="2.8" rx=".7"/><rect class="f" x="8.6" y="10.2" width="2.8" height="2.8" rx=".7"/><rect class="f" x="12.6" y="10.2" width="2.8" height="2.8" rx=".7"/><path d="M10.5 18.2h3"/></svg><i class="dot" id="dotApps"></i></span><span class="lb">Apps</span></button>
    <button data-tab="research" aria-label="Onderzoek"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6.2L4.6 18.3A2.1 2.1 0 0 0 6.4 21.5h11.2a2.1 2.1 0 0 0 1.8-3.2L14 9.2V3"/><path class="f" d="M7.4 15h9.2l1.9 3.4a1.1 1.1 0 0 1-1 1.6H6.5a1.1 1.1 0 0 1-1-1.6z"/></svg><i class="dot" id="dotResearch"></i></span><span class="lb">Onderzoek</span></button>
    <button data-tab="team" aria-label="Team"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 20.5c0-3.4 2.8-6.2 6.2-6.2s6.2 2.8 6.2 6.2"/><circle class="f" cx="17.2" cy="9" r="2.6"/><path d="M16.4 14.4c2.9-.3 5 2 5 5"/></svg><i class="dot" id="dotTeam"></i></span><span class="lb">Team</span></button>
  </nav>
</div>

<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="card" id="modalCard"></div></div>
<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/industry.js"></script>
<script src="js/research.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui-industry.js"></script>
<script src="js/ui-research.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
